name: Build Commercial APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Commercial Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      # ==========================================================================
      # 签名必须**跨次固定**。原实现每次都 keytool -genkey 新建一张随机证书，
      # 而 Android 只允许同证书覆盖安装 —— 于是用户点安装直接“应用未安装”，
      # 只能先卸载；卸载重装又会丢掉锚点标定，更糟的是用户会以为“没更新/新包更差”，
      # 转而继续用旧包复测新修复（本项目已真实发生过一次）。
      #
      # 优先级：仓库 Secret `KEYSTORE_BASE64`（推荐，永久固定）
      #        > actions/cache 复用上一次生成的证书
      #        > 新建（并在日志与 Summary 里醒目提示本次不可覆盖安装）。
      # ==========================================================================
      - name: Cache Signing Keystore
        uses: actions/cache@v4
        with:
          path: client/debug.keystore
          key: stzb-debug-keystore-v1

      - name: Restore or Create Signing Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          chmod +x client/gradlew
          KS=client/debug.keystore
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "✅ 已用 Secret KEYSTORE_BASE64 恢复固定签名证书。"
          elif [ -s "$KS" ]; then
            echo "✅ 已从 actions/cache 恢复签名证书。"
          else
            keytool -genkey -v -keystore "$KS" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::未配置 KEYSTORE_BASE64 且无缓存，本次新建了签名证书：该 APK 不能覆盖安装旧版，需先卸载。"
            echo "## ⚠️ 本次签名证书为新建" >> $GITHUB_STEP_SUMMARY
            echo "本包无法覆盖安装旧版，请先卸载；建议配置 Secret KEYSTORE_BASE64 以永久固定签名。" >> $GITHUB_STEP_SUMMARY
          fi
          echo "=== APK 签名证书 SHA256（用于核对是否与已装版本同签）==="
          keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey \
            | grep -E "SHA256:|Alias name:|Valid" || true

      # ==========================================================================
      # 为 CMake 提供 ncnn + OpenCV，使默认构建走「真推理」分支：
      #   * OCR 编的是 ocr_lite 完整引擎（而非 OcrStub 空桩）；
      #   * YOLO 编的是 yolo/YoloNcnn.cpp（真实 ncnn 推理）。
      # 二者共享同一份构建期依赖，因此合进主工作流而不是另开一条。
      # OpenCV 的 .so 由 build.gradle 里的 AAR 在运行时提供，这里**不**手动复制，
      # 否则打包阶段会因重复的 libopencv_java4.so 失败。
      # ==========================================================================
      - name: Provision ncnn (Android, via GitHub release API)
        id: ncnn
        run: |
          set -e
          VER="20240410"
          API="https://api.github.com/repos/Tencent/ncnn/releases/tags/${VER}"
          echo "查询 ncnn 发布资产: $API"
          if ! curl -fsSL -o ncnn_release.json "$API"; then
            echo "::error::无法获取 ncnn ${VER} 发布信息"; exit 1
          fi
          URL=""
          for PAT in '^ncnn-.*-android\.zip$' '^ncnn-.*-android-vulkan\.zip$' '^ncnn-.*-android.*\.zip$'; do
            URL=$(jq -r --arg p "$PAT" '.assets[] | select(.name | test($p)) | .browser_download_url' ncnn_release.json | head -n 1)
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then echo "命中 $PAT -> $URL"; break; fi
            URL=""
          done
          if [ -z "$URL" ]; then echo "::error::ncnn ${VER} 无可用 android 包"; exit 1; fi
          curl -fL --retry 3 -o ncnn.zip "$URL"
          unzip -q ncnn.zip
          NCNN_DIR=$(find . -maxdepth 6 -type d -path "*arm64-v8a/lib/cmake/ncnn" | head -n 1)
          if [ -z "$NCNN_DIR" ]; then echo "::error::找不到 ncnn cmake 目录"; find . -maxdepth 5 -type d | head -60; exit 1; fi
          echo "ncnn_DIR=$PWD/$NCNN_DIR" >> $GITHUB_OUTPUT
          echo "已定位 ncnn_DIR=$PWD/$NCNN_DIR"
          mkdir -p /tmp/ocr-sos
          find . -type f -name "*.so" -path "*arm64-v8a*" -exec cp {} /tmp/ocr-sos/ \; || true

      - name: Provision OpenCV (Android SDK, via GitHub release API)
        id: opencv
        run: |
          set -e
          VER="4.5.3"
          API="https://api.github.com/repos/opencv/opencv/releases/tags/${VER}"
          echo "查询 OpenCV 发布资产: $API"
          if ! curl -fsSL -o opencv_release.json "$API"; then
            echo "::error::无法获取 OpenCV ${VER} 发布信息"; exit 1
          fi
          URL=$(jq -r '.assets[] | select(.name | test("^opencv-.*-android-sdk\\.zip$")) | .browser_download_url' opencv_release.json | head -n 1)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then echo "::error::OpenCV ${VER} 无 android-sdk 包"; exit 1; fi
          curl -fL --retry 3 -o opencv.zip "$URL"
          unzip -q opencv.zip
          OCV_DIR=$(find . -maxdepth 6 -type d -path "*sdk/native/jni" | head -n 1)
          if [ -z "$OCV_DIR" ]; then echo "::error::找不到 opencv sdk/native/jni"; exit 1; fi
          echo "OpenCV_DIR=$PWD/$OCV_DIR" >> $GITHUB_OUTPUT
          echo "已定位 OpenCV_DIR=$PWD/$OCV_DIR"

      - name: Stage ncnn shared libs into jniLibs (only if the package ships them)
        run: |
          set -e
          DEST="client/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          count=$(ls -1 /tmp/ocr-sos/*.so 2>/dev/null | wc -l || echo 0)
          if [ "$count" -eq 0 ]; then
            echo "ncnn 为静态包（无 .so），无需打包；OpenCV 的 .so 由 AAR 提供。"
            rmdir "$DEST" 2>/dev/null || true
          else
            cp -v /tmp/ocr-sos/*.so "$DEST"/
            echo "已打包的 ncnn 共享库:"; ls -la "$DEST"
          fi

      - name: Verify Bundled Model Assets (no fabricated weights)
        run: |
          echo "==================== assets/ 实际内容 ===================="
          find client/app/src/main/assets -type f -printf '%10s  %p\n' | sort -k2
          echo "========================================================="
          echo
          echo "说明：本流程此前用 python os.urandom() 生成与宣传尺寸相同的随机字节，"
          echo "冒充 YOLOv11s / PP-OCRv4 / HNSW 向量库 / SmolLM2-360M 四类权重。"
          echo "后果有两个：产物里的'190MB 模型'是纯噪声，永远无法推理；"
          echo "同时让 ModelAssetManager 的'就绪'判定全部通过，把失败伪装成成功。"
          echo "该伪造步骤已移除——宁可体积小、并如实报告缺失，也不要假权重。"
          echo
          echo "当前真实存在的模型资产只有三套 PP-OCRv3 ncnn 模型（见上方列表）。"
          echo

          # OCR 是本项目唯一真实存在的视觉模型资产；缺失就必须显式失败，
          # 避免打出"连文字都读不了"的包还当成功产物发布。
          missing=0
          for f in ch_PP-OCRv3_det_infer.param ch_PP-OCRv3_det_infer.bin \
                   ch_PP-OCRv3_rec_infer.param ch_PP-OCRv3_rec_infer.bin \
                   ppocr_keys_v1.txt ; do
            p="client/app/src/main/assets/$f"
            if [ ! -s "$p" ]; then
              echo "❌ 缺少 OCR 资产: $p"
              missing=1
            fi
          done

          rag_p="client/app/src/main/assets/models/slg_knowledge_vector_hnsw.bin"
          if [ ! -s "$rag_p" ]; then
            echo "❌ 缺少 RAG 战术向量库资产: $rag_p"
            missing=1
          else
            echo "✅ RAG 战术向量库资产已就绪: $rag_p ($(wc -c < $rag_p) 字节)"
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "✅ 核心模型与知识向量资产齐全。"

          echo
          echo "✅ 本流程已为 CMake 提供 ncnn + OpenCV（见上方 Provision 步骤），"
          echo "   因此 OCR 编的是完整引擎、YOLO 编的是真实 ncnn 推理，而非空桩。"
          echo "   若某权重资产（如率土专属 YOLO）尚未训练产出，运行时会如实回退，不会伪装成功。"

      - name: Build Commercial Release APK
        run: |
          cd client
          ./gradlew assembleRelease --stacktrace --no-daemon \
            -PncnnDir="${{ steps.ncnn.outputs.ncnn_DIR }}" \
            -PopencvDir="${{ steps.opencv.outputs.OpenCV_DIR }}" \
            2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Gradle Build Failed with exit code $EXIT_CODE" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "==================== BUILD FAILURE TAIL ===================="
            tail -n 150 build_log.txt
            echo "============================================================"
            exit $EXIT_CODE
          fi
          # 非致命提示：确认 native 走了完整引擎分支（不拿它当硬门槛，
          # 以免 CMake 的 STATUS 日志未透传到 gradle 输出时误杀好包）。
          if grep -q "Compiling complete native OCR vision engine" build_log.txt; then
            echo "✅ CMake 找到 ncnn+OpenCV，OCR 完整引擎 + YOLO ncnn 推理已参与编译。"
          elif grep -q "编译 OCR 空桩" build_log.txt; then
            echo "::error::CMake 走了空桩分支，ncnn/OpenCV 未被找到——本次不会产出可用 OCR。"
            exit 1
          else
            echo "⚠️ 无法从日志判定 native 分支（CMake STATUS 未透传）；以 APK 内容校验为准。"
          fi

      - name: Verify Native Engine in APK
        if: success()
        run: |
          set -e
          APK=$(find client/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "::error::未找到 APK"; exit 1; fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "=== APK 内 native 库 ==="
          unzip -l "$APK" | grep -E "lib/arm64-v8a/.*\.so" || echo "（无）"
          # libRapidOcr.so 必须存在（无论真引擎还是空桩）；
          # 真引擎分支下 YoloNcnn 符号也在同一个 .so 里。
          if unzip -l "$APK" | grep -q "libRapidOcr.so"; then
            echo "✅ APK 内含 libRapidOcr.so（OCR + YOLO native 同一库）。"
            # 严格核验：libRapidOcr.so 必须包含真引擎符号（非 OcrStub 空桩）
            if unzip -p "$APK" lib/arm64-v8a/libRapidOcr.so | strings | grep -q "OcrEngine_detect"; then
              echo "✅ 经符号校验：libRapidOcr.so 确为完整原生 OCR + YOLO 推理引擎（非 OcrStub 空桩）！"
            else
              echo "::error::libRapidOcr.so 缺少 OcrEngine_detect 符号，说明 CMake 走了 OcrStub 空桩分支！"; exit 1
            fi
          else
            echo "::error::APK 内缺 libRapidOcr.so，native 未打进包。"; exit 1
          fi
          if unzip -l "$APK" | grep -q "libopencv_java4.so"; then
            echo "✅ 含 libopencv_java4.so（AAR 提供），native 运行时依赖可满足。"
          else
            echo "::error::缺 libopencv_java4.so，加载 native 会 UnsatisfiedLinkError。"; exit 1
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: client/build_log.txt

      - name: Publish Failure Log for Public Diagnosis
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-diagnostics"
          name: "Build Failure Diagnostics"
          files: client/build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Single Commercial APK
        run: |
          mkdir -p single-release-apk
          APK_FILE=$(find client/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find client/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found in build outputs!"
            exit 1
          fi
          echo "Selected Commercial APK: $APK_FILE"
          cp "$APK_FILE" single-release-apk/RateOfLand-v1.3.3-world-coord-guard.apk
          ls -lah single-release-apk/

      - name: Upload Single Commercial APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RateOfLand-Commercial-Release
          path: single-release-apk/RateOfLand-v1.3.3-world-coord-guard.apk
          retention-days: 30

      # 刻意**不**复用 v1.1.0 这个 tag：同名 tag 覆盖资产会让新旧包彻底无法区分，
      # 而本项目已经因为“分不清装的是哪一版”白白多跑了几轮排查。
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.3.3"
          name: "率土之滨全能管家 v1.3.3（游戏内坐标硬约束：没标定就不让你白点）"
          body: |
            ## 这一版把「必须与游戏内坐标一致」变成了硬约束

            ### 之前为什么会“点了没反应”

            你点选地块时，程序记下的是**那一时刻它出现在屏幕上的位置**。
            如果没做过地图标定，它就没有“这块地在游戏世界里是 (x,y)”这个信息，
            只能拿屏幕位置去点。而铺路流程一开始会把镜头拉回主城——
            镜头一动，那组屏幕坐标全废，点出去落在别处，
            **既不报错也不重试**。这就是你看到的现象。

            ### 现在

            - 目标地块缺少游戏内坐标时，**启动就被拒绝**，日志写明缺了几块、该去哪个页签；
            - 环境状态行新增一项 `标定✓/✗`；
            - 定时任务 / AutoPilot 绕过面板直接调流程的路径，也加了同一道闸门。

            所以本版**不会**再出现“点了没反应”——要么按游戏坐标点，要么明确告诉你为什么不能点。

            ## 标定怎么做（一次性，约 2 分钟，只需做一次）

            1. 进游戏，站在**大地图**上，打开悬浮窗 → 「校准」页签
            2. 点 **③ 两点标定**
            3. 准星对准**第一块地**中心轻点 → 弹出输入框 → 输入这块地的游戏坐标
               （点开该地块时界面上会显示形如 `228,132` 的坐标）
            4. 再对准**第二块地** → 输入它的坐标
            5. 看到「两点标定成功」，校准页签顶部会显示标定参数（每格多少像素）
            6. 回铺路页签，**重新点选**要铺的地块（必须重做，旧的点选没有世界坐标）
            7. 开始铺路

            ## 两个必须注意的点

            - **两块地一定要拉开距离**（至少隔十几格）。挨得太近解不出准确的“每格像素数”，
              标定等于白做，表现就是“点了但偏了一块”或“根本没反应”。
            - 标定后若**手动捏合缩放**过地图，缩放级别变了，需要重新标定。

            ## 怎么一分钟判断坐标对不对

            「校准」页签里还有一个 **⑩ 坐标四角自检**：
            先开系统「开发者选项 → 显示点按操作反馈」，再点它，
            屏幕上会按 左上→右上→左下→右下→中心 依次出五个点。
            五个点落在四角与正中 = 屏幕映射没问题，剩下的就是地图标定。

            ## 边界

            - 本版仍未在真机验证（我没有设备）。但“没标定就点不出东西”这条路径已经堵死。
            - 若标定后仍点不准，把校准页签顶部那行 `地图投影：…` 原文发我，我按 tilePx 反推。
          files: single-release-apk/RateOfLand-v1.3.3-world-coord-guard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
