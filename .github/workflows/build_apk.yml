name: Build Commercial APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Commercial Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Grant Execute Permission & Pre-create Keystore
        run: |
          chmod +x client/gradlew
          keytool -genkey -v -keystore client/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Verify Bundled Model Assets (no fabricated weights)
        run: |
          echo "==================== assets/ 实际内容 ===================="
          find client/app/src/main/assets -type f -printf '%10s  %p\n' | sort -k2
          echo "========================================================="
          echo
          echo "说明：本流程此前用 python os.urandom() 生成与宣传尺寸相同的随机字节，"
          echo "冒充 YOLOv11s / PP-OCRv4 / HNSW 向量库 / SmolLM2-360M 四类权重。"
          echo "后果有两个：产物里的'190MB 模型'是纯噪声，永远无法推理；"
          echo "同时让 ModelAssetManager 的'就绪'判定全部通过，把失败伪装成成功。"
          echo "该伪造步骤已移除——宁可体积小、并如实报告缺失，也不要假权重。"
          echo
          echo "当前真实存在的模型资产只有三套 PP-OCRv3 ncnn 模型（见上方列表）。"
          echo

          # OCR 是本项目唯一真实存在的视觉模型资产；缺失就必须显式失败，
          # 避免打出"连文字都读不了"的包还当成功产物发布。
          missing=0
          for f in ch_PP-OCRv3_det_infer.param ch_PP-OCRv3_det_infer.bin \
                   ch_PP-OCRv3_rec_infer.param ch_PP-OCRv3_rec_infer.bin \
                   ppocr_keys_v1.txt ; do
            p="client/app/src/main/assets/$f"
            if [ ! -s "$p" ]; then
              echo "❌ 缺少 OCR 资产: $p"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "✅ OCR 资产齐全。"

          echo
          echo "⚠️ 构建期依赖提示：CMake 需要 ncnn + OpenCV 才会编译真正的 OCR 引擎"
          echo "   （见 client/app/src/main/cpp/CMakeLists.txt）。若未提供，本次构建的是"
          echo "   OcrStub 空桩，APK 内 OCR 不可用——运行时会明确报错而不再静默返回空结果。"

      - name: Build Commercial Release APK
        run: |
          cd client
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Gradle Build Failed with exit code $EXIT_CODE" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "==================== BUILD FAILURE TAIL ===================="
            tail -n 150 build_log.txt
            echo "============================================================"
            exit $EXIT_CODE
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: client/build_log.txt

      - name: Publish Failure Log for Public Diagnosis
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-diagnostics"
          name: "Build Failure Diagnostics"
          files: client/build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Single Commercial APK
        run: |
          mkdir -p single-release-apk
          APK_FILE=$(find client/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find client/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found in build outputs!"
            exit 1
          fi
          echo "Selected Commercial APK: $APK_FILE"
          cp "$APK_FILE" single-release-apk/RateOfLand-Commercial-Release.apk
          ls -lah single-release-apk/

      - name: Upload Single Commercial APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RateOfLand-Commercial-Release
          path: single-release-apk/RateOfLand-Commercial-Release.apk
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.7"
          name: "率土之滨全能管家 v1.0.7 商业化落地稳定版"
          files: single-release-apk/RateOfLand-Commercial-Release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
