name: Build Commercial APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Commercial Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Grant Execute Permission & Pre-create Keystore
        run: |
          chmod +x client/gradlew
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Build Commercial Release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: |
          cd client
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Gradle Build Failed with exit code $EXIT_CODE" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Prepare Single Commercial APK
        run: |
          mkdir -p single-release-apk
          APK_FILE=$(find client/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found in build outputs!"
            exit 1
          fi
          echo "Selected Commercial APK: $APK_FILE"
          cp "$APK_FILE" single-release-apk/RateOfLand-Commercial-v1.0.2.apk
          ls -lah single-release-apk/

      - name: Upload Single Commercial APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RateOfLand-Commercial-v1.0.2
          path: single-release-apk/RateOfLand-Commercial-v1.0.2.apk
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.2"
          name: "率土之滨全能管家 v1.0.2 商业旗舰版"
          files: single-release-apk/RateOfLand-Commercial-v1.0.2.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
