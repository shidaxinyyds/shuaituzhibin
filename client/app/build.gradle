plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.stzb.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.stzb.assistant"
        minSdk 26
        targetSdk 34
        versionCode 110
        versionName "1.1.0-commercial-release"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti -O3 -fvisibility=hidden"
                def cmakeArgs = ["-DANDROID_STL=c++_shared"]
                if (project.hasProperty("ncnnDir") && project.property("ncnnDir")) {
                    cmakeArgs.add("-Dncnn_DIR=${project.property('ncnnDir')}".toString())
                }
                if (project.hasProperty("opencvDir") && project.property("opencvDir")) {
                    cmakeArgs.add("-DOpenCV_DIR=${project.property('opencvDir')}".toString())
                }
                arguments cmakeArgs.toArray(new String[0])
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    androidResources {
        noCompress 'bin', 'gguf', 'tflite', 'onnx', 'param'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // AndroidX & 核心基础库
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'

    // 协程支持（用于非阻塞后台状态机循环）
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // 轻量级 OpenCV Android SDK 依赖（无需下载几十兆完整版）
    implementation 'com.quickbirdstudios:opencv:4.5.3.0'

    // Shizuku 免 Root 底层 ADB 触控 API (抗厂商系统杀后台与安全限制)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // 预留网络库（用于最后阶段对接 Supabase 鉴权）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ONNX Runtime Mobile：③bge 中文向量 / ④意图+槽位微脑 的端侧推理运行时
    // （ARM64 约 12MB，与 assets/models 下的 INT8 权重配合；缺权重时只是加载失败，不影响编译）
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
}
