plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.stzb.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.stzb.assistant"
        minSdk 26
        targetSdk 34
        versionCode 107
        versionName "1.0.7-commercial-stable"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti -O3 -fvisibility=hidden"
                arguments "-DANDROID_STL=c++_shared"
                // 可选：把 ncnn / OpenCV 预编译包接进来，让 native 层编译真正的 OCR 引擎，
                // 而不是 OcrStub 空桩。用法：
                //     ./gradlew assembleRelease \
                //         -PncnnDir=/path/to/ncnn-android/arm64-v8a/lib/cmake/ncnn \
                //         -PopencvDir=/path/to/opencv-android-sdk/sdk/native/jni
                // 未提供时工程仍可编译，但 APK 内文字识别不可用（运行时会明确报错）。
                if (project.hasProperty("ncnnDir")) {
                    arguments "-Dncnn_DIR=${project.property("ncnnDir")}"
                }
                if (project.hasProperty("opencvDir")) {
                    arguments "-DOpenCV_DIR=${project.property("opencvDir")}"
                }
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    androidResources {
        noCompress 'bin', 'gguf', 'tflite', 'onnx', 'param'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // AndroidX & 核心基础库
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'

    // 协程支持（用于非阻塞后台状态机循环）
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // 轻量级 OpenCV Android SDK 依赖（无需下载几十兆完整版）
    implementation 'com.quickbirdstudios:opencv:4.5.3.0'

    // Shizuku 免 Root 底层 ADB 触控 API (抗厂商系统杀后台与安全限制)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // 预留网络库（用于最后阶段对接 Supabase 鉴权）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
