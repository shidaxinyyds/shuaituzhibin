# 率土之滨 YOLO 数据集配置（ultralytics 格式）
# 类别顺序必须与 YoloDetector.DetectionClass.id 一致，错位=检错目标。
path: ./dataset        # 数据集根目录（含 images/ 与 labels/）
train: images/train
val: images/val

nc: 7
# ---- 契约重锚：YOLO 只负责大地图上"密集/遮挡/跨缩放"的多目标。----
# 固定 UI 按钮(出征/驻守/撤退/确定/取消)、军令红点、敌袭告警一律走确定性通道
# （语义 OCR / HSV 角标 / RaidRadarDetector），不进本表。
# 兵种：行军只有微缩模型、无独立兵种图标；骑/步可分→建两类，弓/枪/盾步兵合并。
# id 必须与 YoloDetector.DetectionClass 严格对齐，错位=检错目标。
names:
  0: enemy_tile      # 敌对红地
  1: resource_tile   # 资源地块
  2: march_line      # 行军线（敌我由端侧颜色通道判，故不区分红/蓝线）
  3: fortress        # 要塞/关卡/分城/城池等大建筑
  4: camp            # 营寨/营帐（玩家）/ NPC 营地
  5: troop_cavalry   # 骑兵部队（微缩行军模型，马上）
  6: troop_infantry  # 步兵部队（弓/枪/盾合并，缩放下不可稳定区分）
