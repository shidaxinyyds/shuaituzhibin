# 率土之滨 YOLO 数据集配置（ultralytics 格式）
# 类别顺序必须与 YoloDetector.DetectionClass.id 一致，错位=点到错误按钮。
path: ./dataset        # 数据集根目录（含 images/ 与 labels/）
train: images/train
val: images/val

nc: 18
names:
  0: attack          # 出征按钮
  1: defend          # 驻守按钮
  2: retreat         # 撤退按钮
  3: confirm         # 确定按钮
  4: cancel         # 取消按钮
  5: mail_alert      # 军令红点
  6: radar_alert     # 敌袭告警
  7: enemy_tile      # 敌对红地
  8: resource_tile   # 资源地块
  9: march_redline   # 敌军行军红线
  10: city_gate      # 关卡要塞
  # ---- Phase D：部队兵种 & 建筑（多目标）。id 与 YoloDetector.DetectionClass 严格对齐。----
  # 仅当样本量达标后才应启用训练；无足够标注时该类在模型上会欠拟合，宁缺毋滥。
  11: troop_cavalry  # 骑兵
  12: troop_shield   # 盾兵
  13: troop_archer   # 弓兵
  14: troop_spearman # 枪兵
  15: building_camp  # 营寨/营帐
  16: building_tower # 箭塔
  17: building_farm  # 屯田
